<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #5288c1;
            background: #000;
            border-radius: 8px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #5288c1;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>🎮 Mini App в Telegram</h2>
    <canvas id="gameCanvas" width="280" height="280"></canvas>
    <button onclick="closeApp()">Закрыть Mini App</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем окно на весь экран

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let x = 140, y = 140;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(x - 15, y - 15, 30, 30);
        }

        // Управление кликом
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            x = e.clientX - rect.left;
            y = e.clientY - rect.top;
            draw();
        });

        function closeApp() {
            tg.close();
        }

        draw();
    </script>
</body>
</html>
